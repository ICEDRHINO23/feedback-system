<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Management | AHPS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f6f9;color:#333}
.header{background:#001f5b;color:#fff;padding:20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.header h1{font-size:30px}.header p{margin-top:6px;opacity:.9}
.container{width:95%;max-width:1600px;margin:25px auto}
.back-btn{display:inline-block;background:#001f5b;color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px;margin-bottom:20px;transition:.3s}.back-btn:hover{background:#003399}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:25px}
.card{border-radius:12px;padding:22px;color:#fff;box-shadow:0 5px 15px rgba(0,0,0,.12);transition:.3s}.card:hover{transform:translateY(-5px)}
.card h4{font-size:16px;margin-bottom:12px}.card h2{font-size:36px;font-weight:bold}
.blue{background:#0d6efd}.green{background:#198754}.orange{background:#fd7e14}.purple{background:#6f42c1}.teal{background:#20c997}.red{background:#dc3545}
.filter-box{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:15px}.filters input,.filters select{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:15px}.filters input:focus,.filters select:focus{outline:none;border-color:#001f5b}
.action-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}.action-buttons{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:6px;padding:10px 16px;cursor:pointer;color:#fff;font-weight:bold;transition:.3s}.btn:hover{transform:translateY(-2px)}
.print-btn{background:#198754}.excel-btn{background:#0d6efd}.pdf-btn{background:#dc3545}
.table-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.1);overflow:auto}.table-container{overflow-x:auto;background:#fff;border-radius:12px}
.results-table{width:100%;border-collapse:collapse;background:#fff}.results-table th{background:#001f5b;color:#fff;padding:14px 10px;text-align:center;font-weight:bold;white-space:nowrap}.results-table td{padding:12px 10px;border-bottom:1px solid #e5e5e5;text-align:center}.results-table tbody tr:hover{background:#f8f9fa}
.result-actions{white-space:nowrap}.action-btn,.delete-btn{border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;margin:2px;font-weight:600}.report-action{background:#198754}.report-action:hover{background:#146c43}.delete-btn{background:#dc3545}.delete-btn:hover{background:#bb2d3b}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media(max-width:600px){.container{width:97%;margin:15px auto}.header h1{font-size:24px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.action-bar{align-items:flex-start}.action-buttons{width:100%}.action-buttons .btn{flex:1}.table-card{padding:10px}.results-table{font-size:13px}}
@media print{.back-btn,.filter-box,.action-bar,.dashboard{display:none!important}body{background:#fff}.container{width:100%;max-width:none;margin:0}.table-card{box-shadow:none;padding:0}.header{box-shadow:none}}
</style>
</head>
<body>
<header class="header">
<h1>Results Management</h1>
<p>Academic Heights Public School</p>
</header>

<div class="container">
<a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back To Dashboard</a>

<section class="dashboard">
<div class="card blue"><h4><i class="fas fa-user-graduate"></i> Total Students</h4><h2 id="totalStudents">0</h2></div>
<div class="card green"><h4><i class="fas fa-file-signature"></i> Total Attempts</h4><h2 id="totalAttempts">0</h2></div>
<div class="card orange"><h4><i class="fas fa-chart-line"></i> Average %</h4><h2 id="averagePercentage">0%</h2></div>
<div class="card purple"><h4><i class="fas fa-trophy"></i> Highest %</h4><h2 id="highestPercentage">0%</h2></div>
<div class="card teal"><h4><i class="fas fa-circle-check"></i> Pass %</h4><h2 id="passPercentage">0%</h2></div>
<div class="card red"><h4><i class="fas fa-circle-xmark"></i> Failed</h4><h2 id="failedStudents">0</h2></div>
</section>

<section class="filter-box">
<div class="filters">
<input type="text" id="searchBox" placeholder="🔍 Search Student">
<select id="examFilter"><option value="">All Assessments</option></select>
<select id="subjectFilter"><option value="">All Subjects</option></select>
<select id="classFilter"><option value="">All Classes</option></select>
</div>
</section>

<div class="action-bar">
<h2>Assessment Results</h2>
<div class="action-buttons">
<button class="btn print-btn" id="printBtn"><i class="fas fa-print"></i> Print</button>
<button class="btn excel-btn" id="excelBtn"><i class="fas fa-file-excel"></i> Export Excel</button>
<button class="btn pdf-btn" id="pdfBtn"><i class="fas fa-file-pdf"></i> Export PDF</button>
</div>
</div>

<section class="table-card">
<div class="table-container">
<table class="results-table">
<thead><tr>
<th>Sr No:</th><th>Student</th><th>Assessment</th><th>Subject</th><th>Class</th><th>Section</th><th>Score</th><th>Total</th><th>%</th><th>Date</th><th>Actions</th>
</tr></thead>
<tbody id="resultTable"><tr><td colspan="11">Loading Results...</td></tr></tbody>
</table>
</div>
</section>
</div>

<script src="../js/auth-check.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="../js/results.js"></script>
</body>
</html>
