<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question Manager</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#001f5b;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    width:95%;
    margin:20px auto;
}

.back-btn{
    display:inline-block;
    background:#001f5b;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:6px;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#003399;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.filters{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

input,
select{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}

th{

    background:#001f5b;
    color:white;
    padding:12px;

}

td{

    border:1px solid #ddd;
    padding:10px;
    text-align:center;

}

.action-btn{

    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
    color:white;
    margin:2px;

}

.edit-btn{

    background:#0d6efd;

}

.preview-btn{

    background:#198754;

}

.delete-btn{

    background:#dc3545;

}

.action-btn:hover{

    opacity:.9;

}

.no-data{

    text-align:center;
    padding:30px;
    color:#666;

}

</style>

</head>

<body>

<div class="header">

    <h1>
        Question Manager
    </h1>

    <p>
        Search, Edit & Manage Questions
    </p>

</div>

<div class="container">

    <a
        href="dashboard.html"
        class="back-btn">

        ← Back to Dashboard

    </a>

    <div class="card">

        <div class="filters">

            <input
                type="text"
                id="searchBox"
                placeholder="Search Question">

            <select id="classFilter">

                <option value="">
                    All Classes
                </option>

            </select>

            <select id="subjectFilter">

                <option value="">
                    All Subjects
                </option>

            </select>

            <select id="typeFilter">

                <option value="">
                    Question Type
                </option>

                <option value="mcq">
                    MCQ
                </option>

                <option value="multiple">
                    Multiple Answer
                </option>

                <option value="sentence">
                    Subjective
                </option>

            </select>

        </div>

    </div>

    <div class="card">

        <table>

            <thead>

                <tr>

                    <th>Question</th>
                    <th>Subject</th>
                    <th>Class</th>
                    <th>Type</th>
                    <th>Marks</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="questionTable">

                <tr>

                    <td
                        colspan="6"
                        class="no-data">

                        Loading Questions...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="../js/auth-check.js"></script>
<script src="../js/admin-guard.js"></script>
<script type="module" src="../js/question-manager.js"></script>

</body>
</html>
