<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Manager</title>
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ==========================================
   QUESTION MANAGER EDIT MODAL
========================================== */

.edit-modal-content{
    width:min(94%, 900px);
    max-width:900px;
    margin:35px auto;
    padding:28px;
    max-height:90vh;
    overflow-y:auto;
}

.edit-modal-content h2{
    color:#001f5b;
    margin-bottom:8px;
}

.edit-modal-content .edit-subtitle{
    color:#666;
    font-size:14px;
    margin-bottom:18px;
}

.edit-form-group{
    margin-bottom:16px;
}

.edit-form-group label{
    display:block;
    margin:0 0 6px;
    font-weight:700;
    color:#222;
}

.edit-form-group input,
.edit-form-group textarea,
.edit-form-group select{
    width:100%;
    padding:11px 12px;
    border:1px solid #cfd4da;
    border-radius:7px;
    font-size:15px;
    box-sizing:border-box;
    background:#fff;
}

.edit-form-group textarea{
    min-height:110px;
    resize:vertical;
    line-height:1.45;
}

.edit-readonly{
    background:#f1f3f5 !important;
    color:#555;
}

.edit-options-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.edit-bottom-grid{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:14px;
}

.edit-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid #e5e7eb;
}

.edit-actions button{
    min-width:150px;
    padding:11px 18px;
    border:none;
    border-radius:7px;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.edit-actions .update-question-btn{
    background:#0d6efd;
}

.edit-actions .cancel-question-btn{
    background:#6c757d;
}

@media(max-width:700px){
    .edit-modal-content{
        width:96%;
        margin:15px auto;
        padding:20px;
    }

    .edit-options-grid,
    .edit-bottom-grid{
        grid-template-columns:1fr;
    }

    .edit-actions{
        flex-direction:column-reverse;
    }

    .edit-actions button{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="header">
    <h1>Question Manager</h1>
    <p>Search, Edit & Manage Questions</p>
</div>

<div class="container">
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

    <div class="card">
        <div class="filters">
            <input type="text" id="searchBox" placeholder="Search Question">

            <select id="classFilter">
                <option value="">All Classes</option>
            </select>

            <select id="subjectFilter">
                <option value="">All Subjects</option>
            </select>

            <select id="assessmentFilter">
                <option value="">All Assessments</option>
            </select>

            <select id="typeFilter">
                <option value="">Question Type</option>
                <option value="mcq">MCQ</option>
                <option value="multiple">Multiple Answer</option>
                <option value="sentence">Subjective</option>
            </select>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Question</th>
                    <th>Subject</th>
                    <th>Class</th>
                    <th>Type</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="questionTable">
                <tr>
                    <td colspan="6" class="no-data">Loading Questions...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ========================= -->
<!-- PREVIEW MODAL -->
<!-- ========================= -->
<div id="previewModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePreview()">&times;</span>
        <h2>Question Preview</h2>
        <hr><br>
        <p><b>Question</b></p>
        <p id="previewQuestion"></p>
        <br>
        <p><b>Options</b></p>
        <div id="previewOptions"></div>
        <br>
        <p><b>Correct Answer :</b> <span id="previewAnswer"></span></p>
        <p><b>Marks :</b> <span id="previewMarks"></span></p>
    </div>
</div>

<!-- ========================= -->
<!-- EDIT MODAL -->
<!-- ========================= -->
<div id="editModal" class="modal">
    <div class="modal-content edit-modal-content">
        <span class="close" onclick="closeEdit()">&times;</span>

        <h2>Edit Question</h2>
        <p class="edit-subtitle">Update the question details and save the changes.</p>

        <div class="edit-form-group">
            <label for="editAssessment">Assessment</label>
            <input type="text" id="editAssessment" class="edit-readonly" readonly>
        </div>

        <div class="edit-form-group">
            <label for="editQuestion">Question</label>
            <textarea id="editQuestion" placeholder="Enter the question"></textarea>
        </div>

        <div id="editOptionsSection">
            <div class="edit-options-grid">
                <div class="edit-form-group">
                    <label for="editOptionA">Option A</label>
                    <input type="text" id="editOptionA" placeholder="Enter option A">
                </div>

                <div class="edit-form-group">
                    <label for="editOptionB">Option B</label>
                    <input type="text" id="editOptionB" placeholder="Enter option B">
                </div>

                <div class="edit-form-group">
                    <label for="editOptionC">Option C</label>
                    <input type="text" id="editOptionC" placeholder="Enter option C">
                </div>

                <div class="edit-form-group">
                    <label for="editOptionD">Option D</label>
                    <input type="text" id="editOptionD" placeholder="Enter option D">
                </div>
            </div>
        </div>

        <div class="edit-bottom-grid">
            <div class="edit-form-group">
                <label for="editAnswer">Correct Answer</label>
                <select id="editAnswer">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div class="edit-form-group">
                <label for="editMarks">Marks</label>
                <input type="number" id="editMarks" min="0" step="0.5" placeholder="Marks">
            </div>
        </div>

        <div class="edit-actions">
            <button type="button" class="cancel-question-btn" onclick="closeEdit()">
                Cancel
            </button>
            <button type="button" id="updateBtn" class="update-question-btn">
                <i class="fas fa-save"></i> Update Question
            </button>
        </div>
    </div>
</div>

<script src="../js/auth-check.js"></script>
<script src="../js/admin-guard.js"></script>
<script type="module" src="../js/question-manager.js"></script>
</body>
</html>
