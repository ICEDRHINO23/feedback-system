<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Question | AHPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f4f6f9;color:#102044}.header{background:#001f5b;color:#fff;padding:18px;text-align:center}.container{width:95%;max-width:900px;margin:25px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.1)}.back-btn{display:inline-block;margin-bottom:20px;background:#001f5b;color:#fff;padding:10px 15px;text-decoration:none;border-radius:7px}label{display:block;font-weight:bold;margin:12px 0 6px;color:#001f5b}input,select,textarea{width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccd4e0;border-radius:7px;font-size:15px;background:#fff}textarea{min-height:130px;resize:vertical}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{background:#001f5b;color:#fff;border:none;padding:12px 20px;cursor:pointer;border-radius:7px;font-size:15px;margin-top:10px}button:hover{background:#003399}#multipleSection{padding:15px;background:#f8f8f8;border-radius:7px;margin-bottom:10px}#multipleSection label{margin:8px 0;font-weight:normal;color:#222}#multipleSection input{width:auto;margin-right:10px;margin-bottom:0}.form-note{margin:0 0 20px;color:#666;font-size:14px}.type-note{padding:10px 12px;background:#eef5ff;border-left:4px solid #155eef;border-radius:6px;font-size:13px;color:#344054;margin-bottom:10px}@media(max-width:650px){.field-grid,.option-grid{grid-template-columns:1fr}.container{padding:18px}}
</style>
</head>
<body>
<div class="header"><h1>Create Question</h1><p>AHPS Assessment Management System</p></div>
<div class="container">
<a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
<p class="form-note">Create a question and assign it to the correct class, section and assessment.</p>
<input type="hidden" id="questionId">

<div class="field-grid">
<div><label for="examClass">Class</label><select id="examClass"><option value="">Select Class</option></select></div>
<div><label for="questionSection">Section</label><select id="questionSection"><option value="">Select Section</option></select></div>
</div>

<label for="examSelect">Assessment</label>
<select id="examSelect"><option value="">Select Assessment</option></select>

<label for="questionType">Question Type</label>
<select id="questionType">
<option value="mcq">Single Correct Answer MCQ</option>
<option value="multiple">Multiple Correct Answers MCQ</option>
<option value="truefalse">True / False</option>
<option value="fillblank">Fill in the Blanks</option>
<option value="sentence">Descriptive / Sentence Answer</option>
</select>
<div id="typeNote" class="type-note">Single correct answer MCQ: enter four options and select one correct answer.</div>

<label for="question">Question</label>
<textarea id="question" placeholder="Enter Question"></textarea>

<div id="optionSection">
<label>Options</label>
<div class="option-grid">
<input type="text" id="optionA" placeholder="Option A">
<input type="text" id="optionB" placeholder="Option B">
<input type="text" id="optionC" placeholder="Option C">
<input type="text" id="optionD" placeholder="Option D">
</div>
</div>

<div id="mcqSection">
<label for="answer">Correct Answer</label>
<select id="answer"><option value="">Select Correct Answer</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
</div>

<div id="trueFalseSection" style="display:none">
<label for="trueFalseAnswer">Correct Answer</label>
<select id="trueFalseAnswer"><option value="">Select Correct Answer</option><option value="True">True</option><option value="False">False</option></select>
</div>

<div id="multipleSection" style="display:none">
<h4>Select Correct Answers</h4>
<label><input type="checkbox" id="ansA"> Option A</label>
<label><input type="checkbox" id="ansB"> Option B</label>
<label><input type="checkbox" id="ansC"> Option C</label>
<label><input type="checkbox" id="ansD"> Option D</label>
</div>

<div id="fillBlankSection" style="display:none">
<label for="blankAnswer">Correct Answer / Expected Text</label>
<input type="text" id="blankAnswer" placeholder="Enter the expected answer">
</div>

<div id="sentenceSection" style="display:none">
<label for="modelAnswer">Model Answer</label>
<textarea id="modelAnswer" placeholder="Enter Model Answer"></textarea>
</div>

<label for="marks">Marks</label>
<input type="number" id="marks" placeholder="Marks" min="0" step="0.5">
<button type="button" onclick="saveQuestion()">Save Question</button>
</div>

<script>
function loadQuestionSettings(){
 const classSelect=document.getElementById('examClass'), sectionSelect=document.getElementById('questionSection');
 try{
  const cached=JSON.parse(localStorage.getItem('questionSettings')||'null');
  if(cached){populateQuestionSettings(cached);}
 }catch(e){}
 window.questionSettings={classes:[],sections:[]};
}
function populateQuestionSettings(data){
 const classSelect=document.getElementById('examClass'), sectionSelect=document.getElementById('questionSection');
 const classes=Array.isArray(data.classes)?data.classes:[], sections=Array.isArray(data.sections)?data.sections:[];
 classSelect.innerHTML='<option value="">Select Class</option>'+classes.map(c=>`<option value="${String(c).replace(/"/g,'&quot;')}">Class ${c}</option>`).join('');
 sectionSelect.innerHTML='<option value="">Select Section</option>'+sections.map(s=>`<option value="${String(s).replace(/"/g,'&quot;')}">${s}</option>`).join('');
}
function updateQuestionType(){
 const type=document.getElementById('questionType').value;
 ['optionSection','mcqSection','multipleSection','trueFalseSection','fillBlankSection','sentenceSection'].forEach(id=>document.getElementById(id).style.display='none');
 const note=document.getElementById('typeNote');
 if(type==='mcq'){optionSection.style.display='block';mcqSection.style.display='block';note.textContent='Single correct answer MCQ: enter four options and select one correct answer.';}
 if(type==='multiple'){optionSection.style.display='block';multipleSection.style.display='block';note.textContent='Multiple correct answers: select all options that are correct.';}
 if(type==='truefalse'){trueFalseSection.style.display='block';note.textContent='True / False: enter a statement and select whether it is True or False.';}
 if(type==='fillblank'){fillBlankSection.style.display='block';note.textContent='Fill in the Blanks: use ______ in the question where the answer belongs.';}
 if(type==='sentence'){sentenceSection.style.display='block';note.textContent='Descriptive: students will type a written answer for teacher evaluation.';}
}
document.getElementById('questionType').addEventListener('change',updateQuestionType);
loadQuestionSettings();
updateQuestionType();
</script>
<script type="module" src="../js/questions.js"></script>
</body>
</html>
