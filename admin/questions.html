<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Question</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#001f5b;
color:white;
padding:18px;
text-align:center;
}

.container{
width:95%;
max-width:900px;
margin:25px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.back-btn{
display:inline-block;
margin-bottom:20px;
background:#001f5b;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px;
color:#001f5b;
}

input,
select,
textarea{
width:100%;
padding:11px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

textarea{
min-height:130px;
resize:vertical;
}

.option-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
background:#001f5b;
color:white;
border:none;
padding:12px 20px;
cursor:pointer;
border-radius:5px;
font-size:15px;
margin-top:10px;
}

button:hover{
background:#003399;
}

#multipleSection{
padding:15px;
background:#f8f8f8;
border-radius:5px;
margin-bottom:10px;
}

#multipleSection label{
display:block;
margin-bottom:8px;
font-weight:normal;
color:#222;
}

#multipleSection input{
width:auto;
margin-right:10px;
}

.form-note{
margin:0 0 20px;
color:#666;
font-size:14px;
}

@media(max-width:650px){
.option-grid{
grid-template-columns:1fr;
}
.container{
padding:18px;
}
}

</style>
</head>

<body>

<div class="header">
<h1>Create Question</h1>
</div>

<div class="container">

<a href="dashboard.html" class="back-btn">
← Back to Dashboard
</a>

<p class="form-note">
Create a new question here. Use Question Manager to view, preview, edit or delete existing questions.
</p>

<input type="hidden" id="questionId">

<label for="examSelect">Assessment</label>
<select id="examSelect">
<option value="">Select Assessment</option>
</select>

<label for="questionType">Question Type</label>
<select id="questionType">
<option value="mcq">Single Correct Answer MCQ</option>
<option value="multiple">Multiple Correct Answers MCQ</option>
<option value="sentence">Descriptive / Sentence Answer</option>
</select>

<label for="question">Question</label>
<textarea id="question" placeholder="Enter Question"></textarea>

<div id="optionSection">
<label>Options</label>
<div class="option-grid">
<input type="text" id="optionA" placeholder="Option A">
<input type="text" id="optionB" placeholder="Option B">
<input type="text" id="optionC" placeholder="Option C">
<input type="text" id="optionD" placeholder="Option D">
</div>
</div>

<div id="mcqSection">
<label for="answer">Correct Answer</label>
<select id="answer">
<option value="">Select Correct Answer</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
</div>

<div id="multipleSection" style="display:none;">
<h4>Select Correct Answers</h4>

<label>
<input type="checkbox" id="ansA">
Option A
</label>

<label>
<input type="checkbox" id="ansB">
Option B
</label>

<label>
<input type="checkbox" id="ansC">
Option C
</label>

<label>
<input type="checkbox" id="ansD">
Option D
</label>
</div>

<div id="sentenceSection" style="display:none;">
<label for="modelAnswer">Model Answer</label>
<textarea id="modelAnswer" placeholder="Enter Model Answer"></textarea>
</div>

<label for="marks">Marks</label>
<input type="number" id="marks" placeholder="Marks" min="0" step="0.5">

<button type="button" onclick="saveQuestion()">
Save Question
</button>

</div>

<script>

function updateQuestionType(){

const type = document.getElementById("questionType").value;

document.getElementById("optionSection").style.display = "none";
document.getElementById("mcqSection").style.display = "none";
document.getElementById("multipleSection").style.display = "none";
document.getElementById("sentenceSection").style.display = "none";

if(type === "mcq"){
document.getElementById("optionSection").style.display = "block";
document.getElementById("mcqSection").style.display = "block";
}

if(type === "multiple"){
document.getElementById("optionSection").style.display = "block";
document.getElementById("multipleSection").style.display = "block";
}

if(type === "sentence"){
document.getElementById("sentenceSection").style.display = "block";
}

}

document.getElementById("questionType").addEventListener("change", updateQuestionType);
updateQuestionType();

</script>

<script type="module" src="../js/questions.js"></script>

</body>
</html>
